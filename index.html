<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musikkapelle Meckenhausen – Konzert</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#8a363f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kapelle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wein: #8a363f;
    --wein-dunkel: #6b2730;
    --wein-hell: #f4e7e8;
    --tinte: #1f1a1b;
    --text: #2b2526;
    --leise: #6f6566;
    --papier: #faf7f3;
    --karte: #ffffff;
    --linie: #e8dfdc;
    --leiste: #ffffff;
    --schatten: 0 1px 2px rgba(31,26,27,.06), 0 8px 24px rgba(31,26,27,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wein: #c95b67;
      --wein-dunkel: #e07a85;
      --wein-hell: #3a2226;
      --tinte: #f5efee;
      --text: #ece4e3;
      --leise: #a99c9d;
      --papier: #161213;
      --karte: #201a1b;
      --linie: #34292b;
      --leiste: #1d1718;
      --schatten: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--papier);
    color: var(--text);
    font-family: "Source Sans 3", system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(190px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Kopf ---------- */
  header { padding: 28px 0 8px; text-align: center; }
  .logo-karte {
    display: inline-block; background: #fff; border-radius: 18px;
    padding: 14px 22px; box-shadow: var(--schatten);
  }
  .logo-karte img { display: block; width: min(300px, 70vw); height: auto; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: clamp(26px, 6vw, 34px); line-height: 1.15;
    color: var(--tinte); margin: 22px 0 4px; letter-spacing: -.01em;
  }
  .unter { color: var(--leise); margin: 0; }
  .zierlinie { width: 56px; height: 3px; background: var(--wein); border-radius: 2px; margin: 16px auto 0; }

  .alles-btn {
    display: inline-flex; align-items: center; gap: 8px; margin: 22px auto 0;
    background: var(--wein); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 22px; font: 600 16px/1 "Source Sans 3", sans-serif; cursor: pointer;
  }
  .alles-btn:active { transform: scale(.98); }
  .alles-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* ---------- Liederliste ---------- */
  ol.lieder { list-style: none; margin: 26px 0 0; padding: 0; background: var(--karte);
    border-radius: 16px; box-shadow: var(--schatten); overflow: hidden; }
  ol.lieder li { border-top: 1px solid var(--linie); }
  ol.lieder li:first-child { border-top: 0; }
  .lied {
    width: 100%; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
    background: none; border: 0; padding: 14px 16px; text-align: left; color: inherit;
    font: inherit; cursor: pointer;
  }
  .lied:hover { background: color-mix(in srgb, var(--wein-hell) 50%, transparent); }
  .nr {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 14px; color: var(--leise); background: var(--papier);
  }
  .lied .titel { display: block; font-weight: 600; color: var(--tinte); }
  .lied .info { display: block; font-size: 14px; color: var(--leise); }
  .dauer { font-size: 14px; color: var(--leise); font-variant-numeric: tabular-nums; }
  li.aktiv .lied { background: var(--wein-hell); }
  li.aktiv .nr { background: var(--wein); color: #fff; }
  li.aktiv .titel { color: var(--wein-dunkel); }
  li.fehlt .lied { opacity: .5; }
  .balken { display: none; gap: 2px; align-items: flex-end; height: 14px; }
  li.aktiv.spielt .nr .zahl { display: none; }
  li.aktiv.spielt .balken { display: flex; }
  .balken i { display: block; height: 8px; width: 3px; background: #fff; border-radius: 1px; animation: hupf 1s ease-in-out infinite; }
  .balken i:nth-child(2) { animation-delay: -.3s; } .balken i:nth-child(3) { animation-delay: -.6s; }
  @keyframes hupf { 0%,100% { height: 4px; } 50% { height: 14px; } }
  @media (prefers-reduced-motion: reduce) { .balken i { animation: none; height: 10px; } }

  .tipp { font-size: 14px; color: var(--leise); text-align: center; margin: 22px 8px 0; }
  .tipp b { color: var(--text); }

  /* ---------- Player-Leiste ---------- */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--leiste); border-top: 1px solid var(--linie);
    box-shadow: 0 -6px 24px rgba(0,0,0,.08);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  }
  .jetzt { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .jetzt .titel { font-weight: 700; color: var(--tinte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zeit { font-size: 13px; color: var(--leise); font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 2px 0;
    background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px;
    background: linear-gradient(to right, var(--wein) var(--p,0%), var(--linie) var(--p,0%));
  }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--linie); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--wein); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--wein); margin-top: -5.5px; border: 2px solid var(--leiste);
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--wein); border: 2px solid var(--leiste); }
  .knoepfe { display: flex; justify-content: center; align-items: center; gap: 18px; }
  .knopf { background: none; border: 0; color: var(--tinte); width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; }
  .knopf svg { width: 26px; height: 26px; fill: currentColor; }
  .knopf.klein svg { width: 22px; height: 22px; }
  .knopf.haupt { background: var(--wein); color: #fff; width: 58px; height: 58px; }
  .knopf.haupt svg { width: 28px; height: 28px; }
  .knopf:active { transform: scale(.94); }
  .knopf:focus-visible, .lied:focus-visible, .alles-btn:focus-visible { outline: 3px solid var(--wein); outline-offset: 2px; }
  .knopf.an { color: var(--wein); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-karte"><img src="logo.png" alt="Musikkapelle Meckenhausen seit 1927"></div>
    <h1 id="konzertTitel">Konzert</h1>
    <p class="unter" id="konzertUnter"></p>
    <div class="zierlinie"></div>
    <button class="alles-btn" id="allesBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Alle abspielen
    </button>
  </header>

  <ol class="lieder" id="liste"></ol>

  <p class="tipp"><b>Tipp:</b> Am iPhone in Safari auf „Teilen“ und dann „Zum Home-Bildschirm“ tippen, dann gibt es die Seite wie eine App. Im Auto läuft der Ton über Bluetooth oder CarPlay, die Steuerung klappt über die Lenkradtasten.</p>
</div>

<div class="player" role="region" aria-label="Wiedergabe">
  <div class="wrap">
    <div class="jetzt">
      <span class="titel" id="jetztTitel">Lied auswählen</span>
      <span class="zeit"><span id="zeitJetzt">0:00</span> / <span id="zeitGesamt">0:00</span></span>
    </div>
    <input type="range" id="fortschritt" min="0" max="1000" value="0" aria-label="Position im Lied">
    <div class="knoepfe">
      <button class="knopf klein" id="zurueck15" type="button" aria-label="15 Sekunden zurück">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" font-family="sans-serif">15</text></svg>
      </button>
      <button class="knopf" id="vorher" type="button" aria-label="Vorheriges Lied">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="knopf haupt" id="playBtn" type="button" aria-label="Abspielen">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="knopf" id="weiter" type="button" aria-label="Nächstes Lied">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="knopf klein" id="vor15" type="button" aria-label="15 Sekunden vor">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" font-size="6.5" font-weight="700" text-anchor="middle" font-family="sans-serif">15</text></svg>
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script src="lieder.js"></script>
<script>
(function () {
  var K = window.KONZERT || { titel: "Konzert", untertitel: "", lieder: [] };
  var lieder = K.lieder || [];
  var KAPELLE = "Musikkapelle Meckenhausen";
  var audio = document.getElementById("audio");
  var liste = document.getElementById("liste");
  var playIcon = document.getElementById("playIcon");
  var fortschritt = document.getElementById("fortschritt");
  var aktuell = -1, ziehen = false;

  var PLAY = '<path d="M8 5v14l11-7z"/>';
  var PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  document.getElementById("konzertTitel").textContent = K.titel || "Konzert";
  document.getElementById("konzertUnter").textContent = K.untertitel || "";
  document.title = (K.titel || "Konzert") + " – " + KAPELLE;

  function zeit(s) {
    if (!isFinite(s) || s < 0) return "0:00";
    s = Math.floor(s);
    var m = Math.floor(s / 60), sek = s % 60;
    return m + ":" + (sek < 10 ? "0" : "") + sek;
  }

  // Liste aufbauen
  lieder.forEach(function (l, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.className = "lied"; b.type = "button";
    var nr = document.createElement("span"); nr.className = "nr";
    nr.innerHTML = '<span class="zahl">' + (i + 1) + '</span><span class="balken"><i></i><i></i><i></i></span>';
    var txt = document.createElement("span");
    var t = document.createElement("span"); t.className = "titel"; t.textContent = l.titel || ("Lied " + (i + 1));
    txt.appendChild(t);
    if (l.info) { var inf = document.createElement("span"); inf.className = "info"; inf.textContent = l.info; txt.appendChild(inf); }
    var d = document.createElement("span"); d.className = "dauer"; d.textContent = "";
    b.appendChild(nr); b.appendChild(txt); b.appendChild(d);
    b.addEventListener("click", function () {
      if (i === aktuell) { umschalten(); } else { laden(i, true); }
    });
    li.appendChild(b); liste.appendChild(li);

    // Dauer im Hintergrund ermitteln
    var probe = new Audio(); probe.preload = "metadata";
    probe.addEventListener("loadedmetadata", function () { d.textContent = zeit(probe.duration); probe.src = ""; });
    probe.addEventListener("error", function () { if (probe.getAttribute("src")) { li.classList.add("fehlt"); d.textContent = "fehlt"; } });
    probe.src = l.datei;
  });

  function markieren() {
    Array.prototype.forEach.call(liste.children, function (li, i) {
      li.classList.toggle("aktiv", i === aktuell);
      li.classList.toggle("spielt", i === aktuell && !audio.paused);
    });
    playIcon.innerHTML = audio.paused ? PLAY : PAUSE;
    document.getElementById("playBtn").setAttribute("aria-label", audio.paused ? "Abspielen" : "Pause");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
  }

  function metadaten() {
    if (!("mediaSession" in navigator) || aktuell < 0) return;
    var l = lieder[aktuell];
    var basis = location.href.replace(/[#?].*$/, "").replace(/[^\/]*$/, "");
    navigator.mediaSession.metadata = new MediaMetadata({
      title: l.titel || ("Lied " + (aktuell + 1)),
      artist: KAPELLE,
      album: K.titel || "Konzert",
      artwork: [
        { src: basis + "icon-192.png", sizes: "192x192", type: "image/png" },
        { src: basis + "icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    });
  }

  function laden(i, abspielen) {
    if (i < 0 || i >= lieder.length) return;
    aktuell = i;
    audio.src = lieder[i].datei;
    document.getElementById("jetztTitel").textContent = (i + 1) + ". " + (lieder[i].titel || "");
    fortschritt.value = 0; fortschritt.style.setProperty("--p", "0%");
    document.getElementById("zeitJetzt").textContent = "0:00";
    document.getElementById("zeitGesamt").textContent = "0:00";
    metadaten();
    try { localStorage.setItem("kapelle-lied", String(i)); } catch (e) {}
    if (abspielen) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    markieren();
  }

  function umschalten() {
    if (aktuell < 0) { laden(0, true); return; }
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); } else audio.pause();
  }
  function naechstes() { if (aktuell < lieder.length - 1) laden(aktuell + 1, true); }
  function vorheriges() {
    if (audio.currentTime > 3 || aktuell <= 0) { audio.currentTime = 0; return; }
    laden(aktuell - 1, true);
  }
  function springen(s) { if (aktuell >= 0) audio.currentTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + s)); }

  document.getElementById("playBtn").addEventListener("click", umschalten);
  document.getElementById("weiter").addEventListener("click", naechstes);
  document.getElementById("vorher").addEventListener("click", vorheriges);
  document.getElementById("vor15").addEventListener("click", function () { springen(15); });
  document.getElementById("zurueck15").addEventListener("click", function () { springen(-15); });
  document.getElementById("allesBtn").addEventListener("click", function () { laden(0, true); });

  audio.addEventListener("play", markieren);
  audio.addEventListener("pause", markieren);
  audio.addEventListener("ended", function () {
    if (aktuell < lieder.length - 1) laden(aktuell + 1, true); else markieren();
  });
  audio.addEventListener("error", function () {
    if (aktuell >= 0 && audio.getAttribute("src")) {
      document.getElementById("jetztTitel").textContent = "Datei fehlt: " + lieder[aktuell].datei;
    }
  });
  audio.addEventListener("loadedmetadata", function () {
    document.getElementById("zeitGesamt").textContent = zeit(audio.duration);
  });
  audio.addEventListener("timeupdate", function () {
    if (!audio.duration || ziehen) return;
    var p = audio.currentTime / audio.duration;
    fortschritt.value = Math.round(p * 1000);
    fortschritt.style.setProperty("--p", (p * 100) + "%");
    document.getElementById("zeitJetzt").textContent = zeit(audio.currentTime);
    if ("mediaSession" in navigator && navigator.mediaSession.setPositionState) {
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: audio.playbackRate }); } catch (e) {}
    }
  });

  fortschritt.addEventListener("input", function () {
    ziehen = true;
    var p = fortschritt.value / 1000;
    fortschritt.style.setProperty("--p", (p * 100) + "%");
    document.getElementById("zeitJetzt").textContent = zeit(p * (audio.duration || 0));
  });
  fortschritt.addEventListener("change", function () {
    if (audio.duration) audio.currentTime = (fortschritt.value / 1000) * audio.duration;
    ziehen = false;
  });

  // Steuerung über Sperrbildschirm, CarPlay, Bluetooth-Tasten
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    var setze = function (aktion, fn) { try { ms.setActionHandler(aktion, fn); } catch (e) {} };
    setze("play", function () { umschalten(); });
    setze("pause", function () { audio.pause(); });
    setze("previoustrack", vorheriges);
    setze("nexttrack", naechstes);
    setze("seekto", function (d) { if (d && d.seekTime != null) audio.currentTime = d.seekTime; });
  }

  // Tastatur am PC: Leertaste = Play/Pause, Pfeile = springen
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON")) return;
    if (e.code === "Space") { e.preventDefault(); umschalten(); }
    else if (e.code === "ArrowRight") springen(15);
    else if (e.code === "ArrowLeft") springen(-15);
  });

  // Zuletzt gehörtes Lied wieder auswählen (ohne automatisch abzuspielen)
  try {
    var zuletzt = parseInt(localStorage.getItem("kapelle-lied"), 10);
    if (zuletzt >= 0 && zuletzt < lieder.length) laden(zuletzt, false);
  } catch (e) {}
  markieren();
})();
</script>
</body>
</html>
